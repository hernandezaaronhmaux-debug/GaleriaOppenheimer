<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Galería - J. Robert Oppenheimer</title>
    <style>
        /* Variables de diseño (Paleta de colores inspirada en la era atómica) */
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent-color: #ff5722; /* Naranja fuego/fisión */
            --accent-glow: rgba(255, 87, 34, 0.3);
            --border-color: #3d3d3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Toque de máquina de escribir/documento clasificado */
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
        }

        /* Contenedor de la Tarjeta */
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px var(--accent-glow);
            border-color: var(--accent-color);
        }

        /* Encabezado / Imagen del personaje */
        .card-header {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            position: relative;
            /* Imagen de Oppenheimer de código abierto o placeholder */
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1000&auto=format&fit=crop'); 
            filter: grayscale(100%) contrast(120%); /* Efecto histórico dramático */
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(transparent, var(--card-bg));
        }

        /* Contenido de la tarjeta */
        .card-body {
            padding: 25px;
            text-align: center;
        }

        .tag {
            display: inline-block;
            background-color: rgba(255, 87, 34, 0.1);
            color: var(--accent-color);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border: 1px solid var(--accent-color);
        }

        .name {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .dates {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .quote {
            font-style: italic;
            font-size: 0.9rem;
            color: #d0d0d0;
            margin-bottom: 25px;
            line-height: 1.4;
            position: relative;
            padding: 0 10px;
        }

        /* Sección del Código QR */
        .qr-section {
            background-color: #1e1e1e;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-code {
            width: 130px;
            height: 130px;
            background-color: white;
            padding: 8px;
            border-radius: 4px;
        }

        .qr-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header"></div>
        
        <div class="card-body">
            <span class="tag">Proyecto Manhattan</span>
            <h2 class="name">J. R. Oppenheimer</h2>
            <div class="dates">1904 – 1967</div>
            
            <p class="quote">
                "Ahora me he convertido en la muerte, el destructor de mundos."
            </p>
            
            <div class="qr-section">
                <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://es.wikipedia.org/wiki/J._Robert_Oppenheimer" alt="Código QR de Oppenheimer">
                <span class="qr-text">Escanea para ver su historia</span>
            </div>
        </div>
    </div>

</body>
</html>
